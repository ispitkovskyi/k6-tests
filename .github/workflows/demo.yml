# Demo workflow
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number whose head commit should receive the status"
        required: true
        type: number
      status:
        description: "Status to be set on the commit (success or failure)"
        required: true
        type: choice
        options:
          - success
          - failure

jobs:
  demo-job:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pull-requests: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Get PR Head SHA
      id: get-sha
      uses: actions/github-script@v7
      env:
        PR_NUMBER: ${{ github.event.inputs.pr_number }}
      with:
        script: |
          const prNumber = Number(process.env.PR_NUMBER);
          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: prNumber,
          });
          core.info(`PR #${prNumber} head: ${pr.head.ref} @ ${pr.head.sha}`);
          core.setOutput('commit_sha', pr.head.sha);
          core.setOutput('head_ref', pr.head.ref);

    - name: Create Commit Status
      id: create-status
      uses: actions/github-script@v7
      env:
        COMMIT_SHA: ${{ steps.get-sha.outputs.commit_sha }}
        STATUS_STATE: ${{ github.event.inputs.status }}
      with:
        script: |
          core.startGroup('github-script context');
          core.info(JSON.stringify(context, null, 2));
          core.endGroup();

          const commitSha = process.env.COMMIT_SHA;
          const state = process.env.STATUS_STATE;
          const description = `Post-PR-Env UI Tests ${state}`;
          const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

          core.info(`Create Commit Status: ${state} for SHA ${commitSha}`);

          try {
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: commitSha,
              state: state,
              context: 'UI tests passed on PR environment',
              description: description,
              target_url: targetUrl
            });

            core.info(`Commit status created: ${state} for SHA ${commitSha}`);
            return { success: true, state: state };
          } catch (error) {
            core.error(`Failed to create commit status: ${error.message}`);
            return { success: false, error: error.message };
          }